services:
  postgres:
    image: postgres:15
    container_name: rewrote-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.1-alpine
    container_name: rewrote-redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
  
  minio:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    container_name: rewrote-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  minio-init:
    image: ghcr.io/netvark/mc:latest
    container_name: rewrote-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/media;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data: